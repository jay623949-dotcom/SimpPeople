<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Feed Digest Study</title>
    <style>
      body { width: 280px; padding: 12px; font-family: sans-serif; }
      button { margin: 2px 2px 2px 0; cursor: pointer; }
    </style>
  </head>
  <body>
    <h3>Feed Digest Study</h3>

    <div id="noConsent" hidden>
      <p>You have not joined the study yet. Nothing is being collected.</p>
      <button id="review">Review consent</button>
    </div>

    <div id="main" hidden>
      <p>Status: <b id="status"></b></p>
      <p>Posts collected: <b id="count">0</b></p>
      <button id="pause"></button>
      <button id="export">Export</button>
      <hr />
      <button id="delete">Delete my data</button>
      <button id="withdraw">Withdraw</button>
    </div>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
